function App() {
  const [page, setPage] = useState("home");
  const [pageId, setPageId] = useState(null);
  const topRef = useRef(null);

  const navigate = (newPage, id = null) => {
    setPage(newPage);
    setPageId(id);
    if (topRef.current) topRef.current.scrollTop = 0;
    else window.scrollTo(0, 0);
  };

  const renderPage = () => {
    switch (page) {
      case "home": return <Home navigate={navigate} />;
      case "servicios": return <ServiciosPage navigate={navigate} />;
      case "servicio": return <ServicioPage id={pageId} navigate={navigate} />;
      case "clientes": return <ClientesPage navigate={navigate} />;
      case "cliente": return <ClientePage id={pageId} navigate={navigate} />;
      case "portfolio": return <PortfolioPage navigate={navigate} />;
      case "contacto": return <ContactoPage navigate={navigate} />;
      default: return <Home navigate={navigate} />;
    }
  };

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080808; color: #fff; }
        @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #080808; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 2px; }
        button { cursor: pointer; }
        a { color: inherit; }
      `}</style>
      <div ref={topRef} style={{ minHeight: "100vh", display: "flex", flexDirection: "column" }}>
        <Nav currentPage={page} navigate={navigate} />
        <main style={{ flex: 1 }}>
          {renderPage()}
        </main>
        <Footer navigate={navigate} />
      </div>
    </>
  );
}

    // Montar la app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
